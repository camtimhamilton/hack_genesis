name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Run unit and spec tests
        run: ruby test/run_all.rb

      - name: Generate demo decisions (deterministic)
        run: ruby src/main.rb --deterministic

      - name: Validate demo decisions
        run: ruby src/scripts/validate_10.rb routing_decisions.json
